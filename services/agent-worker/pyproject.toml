[project]
name = "taxops-agents"
version = "0.0.0"
description = "AI agent runtime for the Tax Operations platform (extraction, validation, and future agents)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "psycopg[binary]>=3.2", "openpyxl>=3.1"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
